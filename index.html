<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhạc Của Quyền Pro Max</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1db954">
    <link rel="apple-touch-icon" href="images/icon-app.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #1db954; --text-color: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #121212; 
            color: var(--text-color); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; touch-action: none;
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .player-container { 
            position: relative; z-index: 10;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 350px; padding: 30px; border-radius: 30px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.6); text-align: center; 
        }

        .img-container { 
            width: 220px; height: 220px; margin: 0 auto 25px; 
            border-radius: 50%; overflow: hidden; 
            border: 5px solid rgba(255,255,255,0.1); 
            animation: rotatePlayer 15s linear infinite; animation-play-state: paused; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
            transition: all 0.3s ease;
        }
        .img-container.playing { animation-play-state: running; box-shadow: 0 0 30px var(--primary-color); }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        h2 { font-size: 20px; margin-bottom: 5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        h3 { font-size: 14px; color: #ccc; margin-bottom: 25px; }
        
        /* Sóng nhạc CSS (An toàn cho iOS) */
        .music-waves {
            display: flex; justify-content: center; align-items: flex-end;
            height: 30px; gap: 4px; margin-bottom: 20px; opacity: 0; transition: opacity 0.3s;
        }
        .music-waves.playing { opacity: 1; }
        .bar { width: 6px; background: var(--primary-color); border-radius: 5px; animation: bounce 1s infinite ease-in-out; }
        .bar:nth-child(1) { animation-delay: 0.1s; height: 10px; } .bar:nth-child(2) { animation-delay: 0.3s; height: 15px; } .bar:nth-child(3) { animation-delay: 0.5s; height: 20px; } .bar:nth-child(4) { animation-delay: 0.2s; height: 12px; } .bar:nth-child(5) { animation-delay: 0.4s; height: 18px; }
        @keyframes bounce { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(2.5); } }
        @keyframes rotatePlayer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .progress-container { background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; margin-bottom: 30px; height: 6px; width: 100%; overflow: hidden; }
        .progress { background: var(--primary-color); border-radius: 10px; height: 100%; width: 0%; transition: width 0.1s linear; }
        
        .controls { display: flex; justify-content: space-around; align-items: center; width: 80%; margin: 0 auto; }
        .btn { background: none; border: none; color: #ccc; font-size: 26px; cursor: pointer; transition: 0.2s; }
        .btn:hover { color: #fff; transform: scale(1.1); }
        .btn-big { font-size: 45px; color: #fff; background: var(--primary-color); width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .btn-big:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div class="player-container" id="player-container">
        <div class="music-waves" id="music-waves">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        
        <div class="img-container" id="img-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3321/3321935.png" alt="Cover" id="cover">
        </div>
        
        <h2 id="title">Đang tải nhạc...</h2>
        <h3 id="artist">Vui lòng đợi</h3>
        
        <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
        </div>
        <div class="controls">
            <button class="btn" id="prev"><i class="fas fa-step-backward"></i></button>
            <button class="btn btn-big" id="play"><i class="fas fa-play"></i></button>
            <button class="btn" id="next"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>
    
    <audio id="audio" playsinline></audio>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(console.log); }

        const externalSongs = [
            {
                name: "Mix Nhạc Dài 2 Tiếng", 
                artist: "Tuyển Tập", 
                // 👇 DÁN LINK COX CỦA BẠN VÀO GIỮA DẤU NHÁY NÀY 👇
                src: "https://files.catbox.moe/ch2s9m.mp3", 
                color: "#ff5500",
                cover: "https://cdn-icons-png.flaticon.com/512/3321/3321935.png"
            }
        ];
        
        // ... Các phần code khác giữ nguyên ...

        // 👇 TÌM VÀ XÓA (HOẶC ẨN) DÒNG NÀY ĐI ĐỂ NHẠC KHÔNG BỊ TỰ ĐỘNG BỎ QUA KHI LỖI 👇
        // audio.addEventListener('error', () => { setTimeout(nextSong, 1000); });
        // ------------------------------------------

        // Cấu hình GitHub (Dựa trên ảnh bạn gửi)
        const GITHUB_USERNAME = 'maihongquyen'; 
        const REPO_NAME = 'quyen1223';
        const FOLDER_NAME = 'music';
        const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FOLDER_NAME}`;

        let songs = [];
        let songIndex = 0;

        // --- HÀM TỔNG HỢP NHẠC ---
        async function fetchSongs() {
            try {
                // Lấy nhạc từ GitHub
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const autoSongs = data
                    .filter(file => file.name.toLowerCase().endsWith('.mp3'))
                    .map(file => ({
                        name: file.name.replace('.mp3', '').replace(/-/g, ' '), 
                        artist: 'Music Player',
                        src: file.download_url,
                        color: randomColor(),
                        cover: 'https://cdn-icons-png.flaticon.com/512/3321/3321935.png'
                    }));

                // Gộp nhạc Link ngoài lên đầu danh sách
                songs = [...externalSongs, ...autoSongs];

                if (songs.length > 0) {
                    loadSong(songs[0]);
                } else {
                    document.getElementById('title').innerText = "Chưa có nhạc!";
                }
            } catch (error) {
                console.error("Lỗi GitHub:", error);
                // Nếu lỗi GitHub thì vẫn chạy nhạc Drive
                if (externalSongs.length > 0) {
                    songs = externalSongs;
                    loadSong(songs[0]);
                }
            }
        }

        // --- CÁC HÀM XỬ LÝ PLAYER ---
        const playerContainer = document.getElementById('player-container');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const audio = document.getElementById('audio');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progress-container');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const cover = document.getElementById('cover');
        const imgContainer = document.getElementById('img-container');
        const musicWaves = document.getElementById('music-waves');

        function randomColor() {
            const colors = ['#8e44ad', '#2980b9', '#c0392b', '#e67e22', '#16a085', '#2c3e50', '#d35400', '#7f8c8d'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function loadSong(song) {
            title.innerText = song.name;
            artist.innerText = song.artist;
            audio.src = song.src;
            
            // Đổi màu nền & nút bấm
            const mainColor = song.color || randomColor();
            document.documentElement.style.setProperty('--primary-color', mainColor);
            document.body.style.background = `linear-gradient(135deg, ${mainColor}, #000)`;
            
            // Cập nhật Lockscreen iPhone
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.name,
                    artist: song.artist,
                    artwork: [{ src: song.cover || 'https://cdn-icons-png.flaticon.com/512/3321/3321935.png', sizes: '512x512', type: 'image/png' }]
                });
            }
        }

        function playSong() {
            playerContainer.classList.add('playing');
            imgContainer.classList.add('playing');
            musicWaves.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            audio.play();
        }

        function pauseSong() {
            playerContainer.classList.remove('playing');
            imgContainer.classList.remove('playing');
            musicWaves.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            const isPlaying = playerContainer.classList.contains('playing');
            if (isPlaying) pauseSong(); else playSong();
        });

        function prevSong() {
            songIndex--;
            if (songIndex < 0) songIndex = songs.length - 1;
            loadSong(songs[songIndex]);
            playSong();
        }

        function nextSong() {
            songIndex++;
            if (songIndex > songs.length - 1) songIndex = 0;
            loadSong(songs[songIndex]);
            playSong();
        }

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        // Tự chuyển bài khi hết
        audio.addEventListener('ended', nextSong);
        
        // Tự bỏ qua nếu lỗi
        audio.addEventListener('error', () => { 
            console.log("Lỗi file nhạc, đang chuyển bài...");
            setTimeout(nextSong, 2000); 
        });

        // Chạy hàm lấy nhạc
        fetchSongs();

    </script>
</body>
</html>
