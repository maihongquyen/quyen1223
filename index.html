<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhạc Của Quyền</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1db954">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3321/3321935.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #1db954; --text-color: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #121212; color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background 0.5s ease; }
        .player-container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); width: 350px; padding: 30px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); text-align: center; position: relative; }
        .img-container { width: 180px; height: 180px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; border: 5px solid rgba(255,255,255,0.1); animation: rotatePlayer 10s linear infinite; animation-play-state: paused; }
        .img-container.playing { animation-play-state: running; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        h2 { font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        h3 { font-size: 14px; color: #b3b3b3; margin-bottom: 25px; }
        .progress-container { background: rgba(255,255,255,0.1); border-radius: 5px; cursor: pointer; margin-bottom: 30px; height: 6px; width: 100%; }
        .progress { background: var(--primary-color); border-radius: 5px; height: 100%; width: 0%; transition: width 0.1s linear; }
        .controls { display: flex; justify-content: space-between; align-items: center; width: 70%; margin: 0 auto; }
        .btn { background: none; border: none; color: #b3b3b3; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .btn:hover { color: #fff; transform: scale(1.1); }
        .btn-big { font-size: 50px; color: #fff; background: var(--primary-color); width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(29, 185, 84, 0.4); }
        .btn-big:hover { transform: scale(1.05); }
        @keyframes rotatePlayer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="player-container" id="player-container">
        <div class="img-container" id="img-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3321/3321935.png" alt="Cover" id="cover">
        </div>
        <h2 id="title">Đang tải...</h2>
        <h3 id="artist">...</h3>
        <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
        </div>
        <div class="controls">
            <button class="btn" id="prev"><i class="fas fa-step-backward"></i></button>
            <button class="btn btn-big" id="play"><i class="fas fa-play"></i></button>
            <button class="btn" id="next"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>
    <audio id="audio"></audio>

    <script>
        // --- 1. KÍCH HOẠT PWA (APP) ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker đã chạy!'))
                .catch((error) => console.log('Lỗi SW:', error));
        }

        // --- 2. DANH SÁCH 10 BÀI HÁT ---
        const songs = [
            { name: 'Bài 1', artist: 'Artist 1', src: 'music/song1.mp3', color: '#8e44ad' },
            { name: 'Bài 2', artist: 'Artist 2', src: 'music/song2.mp3', color: '#2980b9' },
            { name: 'Bài 3', artist: 'Artist 3', src: 'music/song3.mp3', color: '#c0392b' },
            { name: 'Bài 4', artist: 'Artist 4', src: 'music/song4.mp3', color: '#e67e22' },
            { name: 'Bài 5', artist: 'Artist 5', src: 'music/song5.mp3', color: '#16a085' },
            { name: 'Bài 6', artist: 'Artist 6', src: 'music/song6.mp3', color: '#2c3e50' },
            { name: 'Bài 7', artist: 'Artist 7', src: 'music/song7.mp3', color: '#f1c40f' },
            { name: 'Bài 8', artist: 'Artist 8', src: 'music/song8.mp3', color: '#d35400' },
            { name: 'Bài 9', artist: 'Artist 9', src: 'music/song9.mp3', color: '#7f8c8d' },
            { name: 'Bài 10', artist: 'Artist 10', src: 'music/song10.mp3', color: '#27ae60' }
        ];

        // --- 3. LOGIC PHÁT NHẠC ---
        const playerContainer = document.getElementById('player-container');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const audio = document.getElementById('audio');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progress-container');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const cover = document.getElementById('cover');
        const imgContainer = document.getElementById('img-container');

        let songIndex = 0;

        function loadSong(song) {
            title.innerText = song.name;
            artist.innerText = song.artist;
            audio.src = song.src;
            // Dùng ảnh online mặc định
            cover.src = 'https://cdn-icons-png.flaticon.com/512/3321/3321935.png';
            document.body.style.background = `linear-gradient(to bottom, ${song.color}, #121212)`;
        }

        function playSong() {
            playerContainer.classList.add('playing');
            imgContainer.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            audio.play();
        }

        function pauseSong() {
            playerContainer.classList.remove('playing');
            imgContainer.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            const isPlaying = playerContainer.classList.contains('playing');
            if (isPlaying) pauseSong(); else playSong();
        });

        function prevSong() {
            songIndex--;
            if (songIndex < 0) songIndex = songs.length - 1;
            loadSong(songs[songIndex]);
            playSong();
        }

        function nextSong() {
            songIndex++;
            if (songIndex > songs.length - 1) songIndex = 0;
            loadSong(songs[songIndex]);
            playSong();
        }

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', nextSong);

        // Chạy bài đầu tiên
        loadSong(songs[songIndex]);
    </script>
</body>
</html>
