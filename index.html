<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhạc Của Quyền Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1db954">
    <link rel="apple-touch-icon" href="images/icon-app.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #1db954; --text-color: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #121212; 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative; 
            /* Fix lỗi cuộn trang trên iPhone */
            touch-action: none;
        }
        
        #visualizer-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 0; opacity: 0.8; pointer-events: none;
        }

        .player-container { 
            position: relative; z-index: 10;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            width: 350px; padding: 30px; border-radius: 30px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.6); 
            text-align: center; 
        }

        .img-container { 
            width: 200px; height: 200px; margin: 0 auto 25px; 
            border-radius: 50%; overflow: hidden; 
            border: 4px solid rgba(255,255,255,0.1); 
            animation: rotatePlayer 15s linear infinite; animation-play-state: paused; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            transition: all 0.3s ease;
        }
        .img-container.playing { animation-play-state: running; box-shadow: 0 0 30px rgba(29, 185, 84, 0.6); }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        h2 { font-size: 24px; margin-bottom: 8px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        h3 { font-size: 15px; color: #ddd; margin-bottom: 30px; font-weight: 400; }
        
        .progress-container { 
            background: rgba(255,255,255,0.15); border-radius: 10px; cursor: pointer; 
            margin-bottom: 35px; height: 8px; width: 100%; overflow: hidden; 
        }
        .progress { 
            background: var(--primary-color); border-radius: 10px; height: 100%; width: 0%; 
            transition: width 0.1s linear; box-shadow: 0 0 10px var(--primary-color); 
        }
        
        .controls { display: flex; justify-content: space-around; align-items: center; width: 85%; margin: 0 auto; }
        .btn { background: none; border: none; color: #ddd; font-size: 28px; cursor: pointer; transition: 0.3s; }
        .btn:hover { color: #fff; transform: scale(1.2); }
        .btn-big { 
            font-size: 50px; color: #fff; background: var(--primary-color); 
            width: 80px; height: 80px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.5); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .btn-big:hover { transform: scale(1.1); background: #1ed760; box-shadow: 0 15px 40px rgba(29, 185, 84, 0.7); }

        @keyframes rotatePlayer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="visualizer-canvas"></canvas>

    <div class="player-container" id="player-container">
        <div class="img-container" id="img-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3321/3321935.png" alt="Cover" id="cover">
        </div>
        <h2 id="title">Đang tải...</h2>
        <h3 id="artist">...</h3>
        <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
        </div>
        <div class="controls">
            <button class="btn" id="prev"><i class="fas fa-step-backward"></i></button>
            <button class="btn btn-big" id="play"><i class="fas fa-play"></i></button>
            <button class="btn" id="next"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>
    
    <audio id="audio" crossorigin="anonymous" playsinline></audio>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(console.log);
        }

        const songs = [
            { name: 'Bài 1', artist: 'Artist 1', src: 'music/song1.mp3', color: '#8e44ad' },
            { name: 'Bài 2', artist: 'Artist 2', src: 'music/song2.mp3', color: '#2980b9' },
            { name: 'Bài 3', artist: 'Artist 3', src: 'music/song3.mp3', color: '#c0392b' },
            { name: 'Bài 4', artist: 'Artist 4', src: 'music/song4.mp3', color: '#e67e22' },
            { name: 'Bài 5', artist: 'Artist 5', src: 'music/song5.mp3', color: '#16a085' },
            { name: 'Bài 6', artist: 'Artist 6', src: 'music/song6.mp3', color: '#2c3e50' },
            { name: 'Bài 7', artist: 'Artist 7', src: 'music/song7.mp3', color: '#f1c40f' },
            { name: 'Bài 8', artist: 'Artist 8', src: 'music/song8.mp3', color: '#d35400' },
            { name: 'Bài 9', artist: 'Artist 9', src: 'music/song9.mp3', color: '#7f8c8d' },
            { name: 'Bài 10', artist: 'Artist 10', src: 'music/song10.mp3', color: '#27ae60' }
        ];

        const playerContainer = document.getElementById('player-container');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const audio = document.getElementById('audio');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progress-container');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const cover = document.getElementById('cover');
        const imgContainer = document.getElementById('img-container');
        const canvas = document.getElementById('visualizer-canvas');
        const ctx = canvas.getContext('2d');

        let songIndex = 0;
        let audioContext, analyser, source;
        let isAudioContextSetup = false;

        function setupAudioContext() {
            if (isAudioContextSetup) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 256;
            isAudioContextSetup = true;
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = songs[songIndex].color || '#121212';
            ctx.globalAlpha = 0.2;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;
            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] * 2;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(x, canvas.height - barHeight / 2, barWidth, barHeight / 2);
                x += barWidth + 1;
            }
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function loadSong(song) {
            title.innerText = song.name;
            artist.innerText = song.artist;
            audio.src = song.src;
            cover.src = 'https://cdn-icons-png.flaticon.com/512/3321/3321935.png';
            document.documentElement.style.setProperty('--primary-color', song.color);

            // --- PHẦN MỚI: CẤU HÌNH CHO LOCKSCREEN (MEDIA SESSION) ---
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.name,
                    artist: song.artist,
                    artwork: [
                        { src: 'https://cdn-icons-png.flaticon.com/512/3321/3321935.png', sizes: '512x512', type: 'image/png' }
                    ]
                });
                // Đăng ký các nút bấm trên Lockscreen
                navigator.mediaSession.setActionHandler('play', playSong);
                navigator.mediaSession.setActionHandler('pause', pauseSong);
                navigator.mediaSession.setActionHandler('previoustrack', prevSong);
                navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            }
        }

        function playSong() {
            if (!isAudioContextSetup) { setupAudioContext(); drawVisualizer(); }
            if (audioContext && audioContext.state === 'suspended') { audioContext.resume(); }
            
            playerContainer.classList.add('playing');
            imgContainer.classList.add('playing');
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            audio.play();
        }

        function pauseSong() {
            playerContainer.classList.remove('playing');
            imgContainer.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            const isPlaying = playerContainer.classList.contains('playing');
            if (isPlaying) pauseSong(); else playSong();
        });

        function prevSong() {
            songIndex--;
            if (songIndex < 0) songIndex = songs.length - 1;
            loadSong(songs[songIndex]);
            playSong();
        }

        function nextSong() {
            songIndex++;
            if (songIndex > songs.length - 1) songIndex = 0;
            loadSong(songs[songIndex]);
            playSong();
        }

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', nextSong);
        audio.addEventListener('error', function() { setTimeout(nextSong, 1000); });

        loadSong(songs[songIndex]);
    </script>
</body>
</html>
